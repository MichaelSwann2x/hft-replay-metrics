[project]
name = "hft-replay-metrics"
version = "0.2.0"
description = "Queue position, latency, and fee-impact metrics for HFT backtest replay analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
[project.urls]
Source = "https://github.com/MichaelSwann2x/hft-replay-metrics"
Original = "https://github.com/mirkovicdev/HFTENGINE"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/hft_replay_metrics"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
